<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Result | Safety Portal</title>
    <link rel="stylesheet" href="ketqua.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="result-wrapper">
        
        <div class="score-dashboard" id="main-card">
            <div class="chart-section">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path class="circle" id="score-path" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <text x="18" y="20.5" class="percentage" id="score-text">0%</text>
                </svg>
            </div>
            
            <div class="info-section">
                <h1 id="result-status" class="status-title">...</h1>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <span class="stat-label" id="lbl-candidate">ĐỊNH DANH / CCCD</span>
                        <span class="stat-value" id="student-id">---</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label" id="lbl-correct-count">SỐ CÂU ĐÚNG</span>
                        <span class="stat-value" id="correct-count">0 / 0</span>
                    </div>
                </div>
                <div id="candidate-extra-info" class="candidate-extra-info"></div>

                <div class="action-group">
                    <button id="btn-review" class="btn btn-primary">Xem Chi Tiết Bài Làm</button>
                    <button id="btn-home" class="btn btn-secondary">Về Trang Chủ</button>
                </div>
            </div>
        </div>

        <div id="review-section" class="review-container" style="display: none;">
            <div class="review-header">
                <h2 id="lbl-detail-title">Chi Tiết Đáp Án</h2>
                <div class="legend-box">
                    <span><span class="icon-legend correct">✓</span> <span id="lbl-correct-legend">Đáp án đúng</span></span>
                    <span><span class="icon-legend wrong">✕</span> <span id="lbl-wrong-legend">Bạn chọn sai</span></span>
                </div>
            </div>
            
            <div id="review-content">
                </div>
        </div>
        
    </div>
    <script src="result.js"></script>
</body>
</html>
